name: tagpr

on:
  push:
    branches:
      - main

jobs:
  tagpr:
    runs-on: ubuntu-latest
    outputs:
      tagpr-tag: ${{ steps.run-tagpr.outputs.tag }}
    permissions:
      contents: write
      pull-requests: write
      issues: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - id: run-tagpr
        uses: Songmu/tagpr@v1

  flakehub:
    needs: tagpr
    if: needs.tagpr.outputs.tagpr-tag != ''
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/flakehub.yml
    with:
      tag: ${{ needs.tagpr.outputs.tagpr-tag }}
