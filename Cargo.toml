[package]
name = "agnt"
version = "0.1.0"
edition = "2024"
description = "TUI for managing local Claude Code and Codex sessions"
repository = "https://github.com/snrsw/agnt"
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
directories = "6"
fd-lock = "4"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time"] }
unicode-width = "0.2"
